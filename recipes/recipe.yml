---
name: bazzite-dawret
description: Personal bazzite image with Qemu and Hyprland

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: dnf
    repos:
        copr:
          - lionheartp/Hyprland
    install:
      packages:
        - qemu-kvm
        - libvirt
        - virt-manager
        - edk2-ovmf
        - qemu
        - guestfs-tools

        - hyprland
        - xdg-desktop-portal-hyprland
        # Bazzite ships terra-xorg-x11-server-Xwayland, which doesn't provide
        # xorg-x11-server-Xwayland(x86-64) required by the Hyprland copr.
        # Swap it for Fedora's Xwayland (needs allow-erasing below).
        - xorg-x11-server-Xwayland
        - waybar 
        - kitty
        - alacritty
        - tailscale
      allow-erasing: true

  - type: systemd
    system:
      enabled:
        - libvirtd.service

